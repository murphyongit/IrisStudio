name: Build IW4iris

on:
  push:
    branches: [main]
    paths: ['iw4/**', '.github/workflows/iw4.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The DirectX SDK (June 2010): only its headers and 32-bit libraries, kept between builds
      - uses: actions/cache@v4
        id: dxsdk
        with:
          path: dxsdk
          key: dxsdk-jun10-x86
      - name: DirectX SDK
        if: steps.dxsdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L --retry 3 -o dxsdk.exe https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe
          7z x dxsdk.exe DXSDK/Include -odxsdk -y | Out-Null
          7z x dxsdk.exe DXSDK/Lib/x86 -odxsdk -y | Out-Null
      - name: DirectX SDK path
        shell: pwsh
        run: '"DXSDK_DIR=$env:GITHUB_WORKSPACE\dxsdk\DXSDK\" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - uses: microsoft/setup-msbuild@v2

      # IW4iris.dll (the mod: the shared core and the Modern Warfare 2 module)
      - name: Build the mod
        shell: pwsh
        run: |
          msbuild IWXMVM.sln /t:iw4 /p:Configuration=Release /p:Platform=x86 /m /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ddraw.dll (the loader the game picks up by itself)
      - name: Build the loader
        shell: pwsh
        run: |
          cmake -S iw4/loader -B iw4/loader/build -A Win32
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build iw4/loader/build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item iw4\bin\Win32\Release\IW4iris.dll dist\
          Copy-Item iw4\loader\build\Release\ddraw.dll dist\

      - uses: actions/upload-artifact@v4
        with:
          name: IW4iris
          path: dist/

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view iw4iris-latest *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete iw4iris-latest --yes --cleanup-tag }
          gh release create iw4iris-latest dist/IW4iris.dll dist/ddraw.dll --title "IW4iris (Modern Warfare 2), latest build" --notes "Build of commit ${{ github.sha }}. Both files go into the game's folder, next to iw4m.exe." --target ${{ github.sha }} --prerelease
