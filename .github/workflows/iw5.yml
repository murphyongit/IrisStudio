name: Build IW5iris

on:
  push:
    branches: [main]
    paths: ['iw5/**', '.github/workflows/iw5.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The DirectX SDK (June 2010): only its headers and 32-bit libraries, kept between builds
      - uses: actions/cache@v4
        id: dxsdk
        with:
          path: dxsdk
          key: dxsdk-jun10-x86
      - name: DirectX SDK
        if: steps.dxsdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L --retry 3 -o dxsdk.exe https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe
          7z x dxsdk.exe DXSDK/Include -odxsdk -y | Out-Null
          7z x dxsdk.exe DXSDK/Lib/x86 -odxsdk -y | Out-Null
      - name: DirectX SDK path
        shell: pwsh
        run: '"DXSDK_DIR=$env:GITHUB_WORKSPACE\dxsdk\DXSDK\" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - uses: microsoft/setup-msbuild@v2

      # IW5iris.dll (the mod: the shared core and the Modern Warfare 3 module, for the 32-bit game)
      - name: Build the mod
        shell: pwsh
        run: |
          msbuild IWXMVM.sln /t:iw5 /p:Configuration=Release /p:Platform=x86 /m /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # IW5iris.exe (starts Plutonium's MW3 in LAN mode and loads the mod)
      - name: Build the starter
        shell: pwsh
        run: |
          cmake -S iw5/launcher -B iw5/launcher/build -A Win32
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build iw5/launcher/build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item iw5\bin\Win32\Release\IW5iris.dll dist\
          Copy-Item iw5\launcher\build\Release\IW5iris.exe dist\

      - uses: actions/upload-artifact@v4
        with:
          name: IW5iris
          path: dist/

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view iw5iris-latest *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete iw5iris-latest --yes --cleanup-tag }
          gh release create iw5iris-latest dist/IW5iris.dll dist/IW5iris.exe --title "IW5iris (Modern Warfare 3), latest build" --notes "Build of commit ${{ github.sha }}. Keep both files together in one folder and start IW5iris.exe." --target ${{ github.sha }} --prerelease
